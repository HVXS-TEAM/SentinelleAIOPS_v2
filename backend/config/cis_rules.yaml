# CIS Cisco IOS Level 1 Benchmark – règles d'audit Sentinelle AIOps
# Format : chaque règle déclare un pattern attendu (regex) ou interdit (regex_forbidden)
# severity : CRITICAL | HIGH | MEDIUM | LOW
# cis_ref  : référence section CIS Benchmark document

version: "1.0"
platform: "cisco-ios"

rules:
  # ── Section 1 : Gestion des accès ──────────────────────────────────────────
  - id: CIS-1.1
    title: "Activer le chiffrement des mots de passe"
    cis_ref: "2.1.1"
    severity: CRITICAL
    description: >
      Les mots de passe doivent être stockés chiffrés dans la configuration.
      La commande 'service password-encryption' active le chiffrement Type 7.
    pattern: "service password-encryption"
    remediation: "Ajouter 'service password-encryption' en configuration globale."

  - id: CIS-1.2
    title: "Utiliser un secret enable fort (Type 5 ou 8)"
    cis_ref: "2.1.2"
    severity: CRITICAL
    description: >
      Le secret enable doit utiliser MD5 (Type 5) ou PBKDF2 (Type 8),
      jamais un 'enable password' en clair ou Type 7.
    pattern: "enable secret [589]"
    regex_forbidden: "enable password"
    remediation: "Remplacer 'enable password' par 'enable secret 8 <hash>'."

  - id: CIS-1.3
    title: "Configurer un timeout de session sur les lignes VTY"
    cis_ref: "2.2.1"
    severity: HIGH
    description: >
      Les sessions VTY inactives doivent expirer après 10 minutes maximum.
    pattern: "exec-timeout 10 0"
    remediation: "Ajouter 'exec-timeout 10 0' sous 'line vty 0 4'."

  - id: CIS-1.4
    title: "Restreindre l'accès SSH (désactiver Telnet)"
    cis_ref: "2.2.2"
    severity: CRITICAL
    description: >
      Seul SSH doit être autorisé sur les lignes VTY. Telnet transmet
      les données en clair et ne doit jamais être utilisé.
    pattern: "transport input ssh"
    regex_forbidden: "transport input telnet"
    remediation: "Configurer 'transport input ssh' sous 'line vty 0 4'."

  - id: CIS-1.5
    title: "Activer SSH version 2"
    cis_ref: "2.2.3"
    severity: HIGH
    description: >
      SSH v1 présente des vulnérabilités connues (BEAST, etc.).
      Seul SSHv2 doit être utilisé.
    pattern: "ip ssh version 2"
    remediation: "Ajouter 'ip ssh version 2' en configuration globale."

  - id: CIS-1.6
    title: "Désactiver l'accès HTTP non sécurisé"
    cis_ref: "2.3.1"
    severity: HIGH
    description: >
      Le serveur HTTP intégré expose une interface d'administration non chiffrée.
      Il doit être désactivé au profit de HTTPS ou de CLI SSH.
    regex_forbidden: "ip http server"
    remediation: "Ajouter 'no ip http server' en configuration globale."

  # ── Section 2 : Logging & Audit ────────────────────────────────────────────
  - id: CIS-2.1
    title: "Activer la journalisation (logging)"
    cis_ref: "3.1.1"
    severity: HIGH
    description: >
      Les événements système doivent être centralisés vers un serveur Syslog.
    pattern: "logging host"
    remediation: "Configurer 'logging host <IP_SYSLOG>' en configuration globale."

  - id: CIS-2.2
    title: "Activer les timestamps dans les logs"
    cis_ref: "3.1.2"
    severity: MEDIUM
    description: >
      Les entrées de log doivent inclure l'heure pour faciliter la corrélation.
    pattern: "service timestamps log datetime"
    remediation: "Ajouter 'service timestamps log datetime msec localtime show-timezone'."

  - id: CIS-2.3
    title: "Définir le niveau de logging (informational minimum)"
    cis_ref: "3.1.3"
    severity: MEDIUM
    description: >
      Le niveau de logging doit être au moins 'informational' (level 6)
      pour capturer les événements importants.
    pattern: "logging trap informational"
    remediation: "Ajouter 'logging trap informational'."

  # ── Section 3 : NTP & Synchronisation ─────────────────────────────────────
  - id: CIS-3.1
    title: "Configurer un serveur NTP"
    cis_ref: "4.1.1"
    severity: MEDIUM
    description: >
      La synchronisation NTP est indispensable pour la cohérence des logs
      et l'authentification par certificats.
    pattern: "ntp server"
    remediation: "Ajouter 'ntp server <IP_NTP>' en configuration globale."

  - id: CIS-3.2
    title: "Authentifier les serveurs NTP"
    cis_ref: "4.1.2"
    severity: LOW
    description: >
      L'authentification NTP empêche les attaques de type NTP Spoofing.
    pattern: "ntp authenticate"
    remediation: "Configurer 'ntp authenticate' et 'ntp trusted-key <ID>'."

  # ── Section 4 : Gestion des interfaces ────────────────────────────────────
  - id: CIS-4.1
    title: "Désactiver CDP sur les interfaces externes"
    cis_ref: "5.1.1"
    severity: HIGH
    description: >
      CDP divulgue des informations de topologie aux équipements connectés.
      Il doit être désactivé sur toutes les interfaces orientées Internet.
    pattern: "no cdp enable"
    remediation: "Ajouter 'no cdp enable' sur chaque interface WAN/externe."

  - id: CIS-4.2
    title: "Désactiver les services IP inutiles"
    cis_ref: "5.2.1"
    severity: MEDIUM
    description: >
      Les services comme 'ip bootp server', 'ip finger', 'ip source-route'
      augmentent la surface d'attaque sans apporter de valeur.
    pattern: "no ip source-route"
    remediation: "Ajouter 'no ip source-route' en configuration globale."

  - id: CIS-4.3
    title: "Activer les ACL de protection sur les interfaces"
    cis_ref: "5.3.1"
    severity: HIGH
    description: >
      Des listes de contrôle d'accès doivent filtrer le trafic entrant
      sur chaque interface exposée.
    pattern: "ip access-group"
    remediation: "Appliquer une ACL avec 'ip access-group <NOM> in' sur les interfaces WAN."

  # ── Section 5 : Bannière & SNMP ────────────────────────────────────────────
  - id: CIS-5.1
    title: "Configurer une bannière légale de connexion"
    cis_ref: "6.1.1"
    severity: LOW
    description: >
      Une bannière MOTD avertit les utilisateurs des conditions d'utilisation
      et constitue un prérequis légal en cas de poursuites.
    pattern: "banner motd"
    remediation: "Ajouter une 'banner motd' mentionnant l'accès restreint."

  - id: CIS-5.2
    title: "Désactiver SNMP v1/v2 ou sécuriser avec v3"
    cis_ref: "6.2.1"
    severity: HIGH
    description: >
      SNMPv1/v2 utilisent des community strings en clair et doivent être
      remplacés par SNMPv3 avec authentification et chiffrement.
    regex_forbidden: "snmp-server community public"
    remediation: "Supprimer 'snmp-server community public' et migrer vers SNMPv3."

  - id: CIS-5.3
    title: "Configurer une chaîne de communauté SNMP non triviale"
    cis_ref: "6.2.2"
    severity: MEDIUM
    description: >
      Si SNMPv2c est utilisé, la community string ne doit jamais être
      'public' ou 'private'.
    regex_forbidden: "snmp-server community private"
    remediation: "Remplacer la community par une valeur forte et unique."
